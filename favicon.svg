  <rect width="32" height="32" rx="8" fill="#1B6B6B"/>

  <!-- Stem -->
  <path d="M16 26 L16 13" stroke="#FFF8EF" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Left leaf (lower) -->
  <path d="M16 21 C12 20 8 16 10 10 C14 12 16 17 16 21Z" fill="#D4A422"/>

  <!-- Right leaf (upper) -->
