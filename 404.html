<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>아이봄 | 출산·육아 코칭</title>
  <script>
    // GitHub Pages SPA redirect: 404를 받으면 경로를 쿼리스트링으로 인코딩해 루트로 보냄
    // pathSegmentsToKeep = 1 → /rest02 유지
    var s = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + s).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(s).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
